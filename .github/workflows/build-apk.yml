name: Build Android APK

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_SITE_URL: ${{ vars.EXPO_PUBLIC_SITE_URL }}
      EXPO_PUBLIC_SUPPORT_EMAIL: ${{ vars.EXPO_PUBLIC_SUPPORT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Pass public settings to the cloud build
        run: |
          for name in EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_ANON_KEY EXPO_PUBLIC_SITE_URL EXPO_PUBLIC_SUPPORT_EMAIL; do
            value="${!name}"
            if [ -n "$value" ]; then
              eas env:create preview --name "$name" --value "$value" --visibility plaintext --force --non-interactive
            fi
          done
      - name: Build APK
        run: eas build --platform android --profile preview --non-interactive --wait --json > build.json
      - name: Publish download link
        run: |
          URL=$(node -p "require('./build.json')[0].artifacts.buildUrl")
          ID=$(node -p "require('./build.json')[0].id")
          OWNER=$(node -p "require('./app.json').expo.owner")
          SLUG=$(node -p "require('./app.json').expo.slug")
          echo "APK: $URL"
          echo "Page: https://expo.dev/accounts/$OWNER/projects/$SLUG/builds/$ID"
          echo "## APK ready: $URL" >> "$GITHUB_STEP_SUMMARY"
