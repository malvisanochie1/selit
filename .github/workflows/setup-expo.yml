name: Setup Expo project

# Run once. Links the app to Expo and turns on over-the-air updates.
on: workflow_dispatch

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - run: eas init --non-interactive --force
      - run: eas update:configure --non-interactive
      - name: Save the link
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.json
          git diff --cached --quiet || git commit -m "Link Expo project"
          git push
